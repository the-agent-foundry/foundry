name: sanitize-and-lint

# Fail-closed gate for The Agent Foundry.
# Runs on every pull request, including from forks. No repository secrets are
# used or needed. If any step exits non-zero, the check fails and the PR cannot
# merge until it is fixed.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sanitize-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sanitizer unit tests
        run: python3 -m unittest discover -s gates/tests -v

      - name: Sanitization scan (Foundry-specific, fail-closed)
        run: python3 gates/scripts/sanitize_scan.py .

      - name: Format lint
        run: python3 gates/scripts/format_lint.py .

      - name: Synthetic fixture smoke test
        run: python3 gates/scripts/fixture_smoke.py .

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          ASSET="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfL "${BASE}/${ASSET}" -o "/tmp/${ASSET}"
          curl -sSfL "${BASE}/gitleaks_${VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          grep "  ${ASSET}$" /tmp/gitleaks_checksums.txt > /tmp/gitleaks_linux_x64.sha256
          (cd /tmp && sha256sum -c /tmp/gitleaks_linux_x64.sha256)
          tar -xzf "/tmp/${ASSET}" -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks current-tree scan (redacted)
        run: gitleaks detect --source . --no-git --redact
